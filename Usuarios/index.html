<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTasks - Usuários</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container header-content">

            <h1 class="logo">DevTasks</h1>

            <nav class="nav">
                <a href="../Home/index.html">Home</a>
                <a href="../Tarefas/index.html">Tarefas</a>
                <a href="index.html" class="active">Usuários</a>
            </nav>

        </div>
    </header>

    <main>

        <section class="users">
            <div class="container">

                <h2>Usuários</h2>

                <div class="user-form">

                    <div class="form-group">
                        <label for="name">Nome:</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Digite o nome do usuário"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail:</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite o e-mail do usuário"
                        >
                    </div>

                    <button type="button" class="button primary">
                        Adicionar usuário
                    </button>

                </div>

                <div class="user-list">

                    <h3>Usuários cadastrados:</h3>

                    <div class="user-card">
                        <div class="user-avatar">A</div>

                        <div class="user-info">
                            <strong>Ana</strong>
                            <span>ana@email.com</span>
                        </div>
                    </div>

                    <div class="user-card">
                        <div class="user-avatar">C</div>

                        <div class="user-info">
                            <strong>Carlos</strong>
                            <span>carlos@email.com</span>
                        </div>
                    </div>

                    <div class="user-card">
                        <div class="user-avatar">M</div>

                        <div class="user-info">
                            <strong>Marina</strong>
                            <span>marina@email.com</span>
                        </div>
                    </div>

                </div>

            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container">
            <p>
                &copy; 2026 DevTasks. Projeto desenvolvido para fins educacionais.
            </p>
        </div>
    </footer>

</body>

</html>
